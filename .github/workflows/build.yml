name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布矩阵（产物名固定 <tool>-<os>-<arch>[.exe]）：
#   aiod-cli-linux-arm64   aarch64-linux-musl   （ubuntu-24.04-arm 原生跑）
#   aiod-cli-linux-amd64   x86_64-linux-musl
#   aiod-cli-macos-arm64   aarch64-macos
#   aiod-cli-macos-amd64   x86_64-macos
#   aiod-cli-windows-arm64.exe  aarch64-windows-gnu  （仅编译校验，无 arm64 Windows runner）
#   aiod-cli-windows-amd64.exe  x86_64-windows-gnu  （ubuntu 交叉编译，windows-latest 上跑 smoke）
# 左边第二列是 zig 编译器自己的 -Dtarget= 三元组（对外契约，原样保留），
# 产物名只用 arm64 / amd64 + macos / windows / linux 这套写法。

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: arm64, target: aarch64-linux-musl, runner: ubuntu-24.04-arm }
          - { os: linux, arch: amd64, target: x86_64-linux-musl,  runner: ubuntu-latest }
          - { os: macos, arch: arm64, target: aarch64-macos,     runner: macos-14 }
          - { os: macos, arch: amd64, target: x86_64-macos,      runner: macos-14 }
          - { os: windows, arch: arm64, target: aarch64-windows-gnu, runner: ubuntu-latest }
          - { os: windows, arch: amd64, target: x86_64-windows-gnu,  runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} 2>&1 | tee build.log

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: err-${{ matrix.os }}-${{ matrix.arch }}
          path: build.log

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          out="aiod-cli-${{ matrix.os }}-${{ matrix.arch }}${ext}"
          cp "zig-out/bin/aiod-cli${ext}" "$out"
          ls -l "$out"

      - name: macOS 临时签名
        if: matrix.os == 'macos'
        run: |
          f="aiod-cli-${{ matrix.os }}-${{ matrix.arch }}"
          codesign --force --sign - --timestamp=none "$f"
          codesign --verify "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: aiod-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            aiod-cli-${{ matrix.os }}-${{ matrix.arch }}
            aiod-cli-${{ matrix.os }}-${{ matrix.arch }}.exe

  # 产物必须在对应平台真跑一遍 version，编译通过不等于能运行
  smoke:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: macos, arch: arm64, runner: macos-14 }
          - { os: macos, arch: amd64, runner: macos-14 }
          - { os: windows, arch: amd64, runner: windows-latest }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aiod-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: bin

      - name: 冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          ls -la bin/
          f="bin/aiod-cli-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.os }}" in windows) f="$f.exe" ;; esac
          chmod +x "$f" 2>/dev/null || true
          "$f" version

  # 跨平台功能测试：编译通过不等于能跑。三个 OS 各自原生构建，跑同一个 Python
  # 测试套件（mock 网关 + MCP 协议 + WebSocket 端到端）。macOS / Windows 的产物
  # 只有在这里才真正被执行过，尤其 ws 自写传输层只有这条链路能验证。
  func:
    runs-on: ${{ matrix.runner }}
    # Windows runner 的 Python stdout 默认是 cp1252，打中文测试名会 UnicodeEncodeError。
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runner: ubuntu-latest }
          - { os: macos,   runner: macos-14 }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 原生构建
        shell: bash
        run: zig build -Doptimize=ReleaseFast

      - name: CLI 冒烟（version / help / 未知命令退出码）
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.os }}" in windows) ext=".exe" ;; esac
          bin="zig-out/bin/aiod-cli$ext"
          ls -l "$bin"
          "$bin" version
          "$bin" help > /dev/null
          "$bin" help all > /dev/null
          if "$bin" definitely-not-a-command > /dev/null 2>&1; then
            echo "未知命令返回 0（应为非 0）"
            exit 1
          fi

      - name: 功能测试套件（全部跑完再判，不早停）
        shell: bash
        run: |
          set -o pipefail
          ext=""
          case "${{ matrix.os }}" in windows) ext=".exe" ;; esac
          bin="zig-out/bin/aiod-cli$ext"
          mkdir -p ci-logs
          rc=0
          run_suite() {
            name="$1"; shift
            echo "===== $name ====="
            if "$@" 2>&1 | tee "ci-logs/$name.txt"; then echo "[PASS] $name"; else echo "[FAIL] $name"; rc=1; fi
          }
          run_suite protocol python tests/mcp_protocol_test.py --bin "$bin" --tools-min 65
          run_suite exitcode python tests/exit_code_test.py --bin "$bin"
          run_suite tools python tests/mcp_aiod_tools_test.py --bin "$bin"
          run_suite bigoutput python tests/mcp_big_output_test.py --bin "$bin"
          run_suite image python tests/mcp_image_result_test.py --bin "$bin"
          run_suite ws python tests/ws_echo_test.py --bin "$bin"
          exit $rc

      - name: 上传测试日志（失败也要）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: func-logs-${{ matrix.os }}
          path: ci-logs/*.txt
          if-no-files-found: warn

  release:
    needs: [build, smoke, func]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          rm -f build.log
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/*
          make_latest: true
